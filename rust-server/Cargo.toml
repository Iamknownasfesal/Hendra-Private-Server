[workspace]
resolver = "3"
members = ["crates/content", "crates/net", "crates/transport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/iamknownasfesal/Hendra-Private-Server"

[workspace.dependencies]
quick-xml = "0.37"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# The simulation is latency-sensitive and the content loader chews through several megabytes of
# XML at boot; both are miserable in an unoptimised debug build. Optimising dependencies only
# keeps our own crates debuggable while making the third-party parsers fast.
[profile.dev.package."*"]
opt-level = 2
