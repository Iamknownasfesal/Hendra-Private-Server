[package]
name = "hendra-godot"
version.workspace = true
edition.workspace = true
license.workspace = true

# A cdylib, because Godot loads this as a native extension rather than linking it.
[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
hendra-net = { path = "../net" }
hendra-transport = { path = "../transport" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
