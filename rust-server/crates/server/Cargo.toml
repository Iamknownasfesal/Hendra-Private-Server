[package]
name = "hendra-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hendra-server"
path = "src/main.rs"

[dependencies]
hendra-content = { path = "../content" }
hendra-net = { path = "../net" }
hendra-sim = { path = "../sim" }
hendra-transport = { path = "../transport" }
hendra-store = { path = "../store" }
hendra-characters = { path = "../characters" }
uuid = { version = "1" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hendra-auth = { path = "../auth" }
hendra-behavior = { path = "../behavior" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror.workspace = true

# The census carries its own checks: one that nothing is left unanswered, and one that the reasons
# it gives about the content are still true.
[[example]]
name = "handlers"
test = true

[[example]]
name = "commands"
test = true

[[example]]
name = "worlds"
test = true
