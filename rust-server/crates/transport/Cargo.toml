[package]
name = "hendra-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
hendra-net = { path = "../net" }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
webpki-roots = "1.0.9"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
