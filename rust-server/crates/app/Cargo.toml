[package]
name = "hendra-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hendra_app"
path = "src/lib.rs"

[[bin]]
name = "hendra-app"
path = "src/main.rs"

[dependencies]
hendra-auth = { path = "../auth" }
hendra-store = { path = "../store" }
hendra-net = { path = "../net" }
hendra-characters = { path = "../characters" }
hendra-content = { path = "../content" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { workspace = true }
uuid = { version = "1" }
serde_json = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hendra-characters = { path = "../characters" }
hendra-content = { path = "../content" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
