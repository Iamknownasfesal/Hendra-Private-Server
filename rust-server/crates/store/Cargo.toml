[package]
name = "hendra-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hendra-content = { path = "../content" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror.workspace = true
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# For the slot numbering a client's drag arrives in, so the conservation tests move items the way
# the game does rather than by naming durable slots directly.
hendra-net = { path = "../net" }
